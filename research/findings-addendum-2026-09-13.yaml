    study_type: quasi_experimental
    sample: n=73 students in 5th and 6th grade (ages 10-12), two public schools in Madrid, Spain; intact classes assigned
      to experimental/control; no prior formal programming
    finding: 10 hours of unplugged CT activities over five weeks (Hello Ruby, Code Master, decomposition/route/pattern tasks).
