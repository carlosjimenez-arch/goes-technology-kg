  ciencias_de_la_computacion_bachillerato:
    status: Introduced 2025 in all public bachilleratos generales as 'asignatura complementaria del tronco común', replacing
      Informática.
    source_id: mined_page_cc
    quote: introduce a partir del año 2025 la asignatura «Ciencias de la Computación» en todos los bachilleratos generales
      del sector público... constituye una evolución de la que se impartía como «Informática»
    programme_source_id: mined_cc_2025_1er_anio
    programme_availability: Only the 1.er año programme was found (45 pp., PDF dated 2025-05-02). The live MINED link returns
      404 on 2026-09-13; the Internet Archive holds captures from 2025-07-09 and 2025-11-04. No 2.º año programme was located
      (Wayback CDX of mined.gob.sv/docs/ lists no such file).
    weekly_hours:
      10: 4
      11: 4
    annual_hours:
      10: 160
      11: 160
    effective_weeks: 32
    integrating_axes:
    - Computación
    - Datos
    - Aplicaciones
    - Sistemas
    units_1er_anio:
    - unit: 1
      title: Introducción a las ciencias de la computación
      weeks: 5
      eje: Computación
      indicators: 10
      focus: 'what a computer is; generations; CT: decomposition, patterns, abstraction, algorithms (input/process/output);
        flowcharts and pseudocode; hardware/software; operating systems'
    - unit: 2
      title: Lógica de programación
      weeks: 5
      eje: Computación
      indicators: 10
      focus: logical/relational operators; sequences in pseudocode and blocks; if/if-else; for/while; debugging in a visual
        programming environment
    - unit: 3
      title: Estructuras de datos
      weeks: 5
      eje: Datos
      indicators: 10
      focus: 'variables, lists, arrays, stacks, queues, tables/dictionaries; linear vs binary search; bubble/selection sort
        — all in a visual programming environment; advanced: import CSV'
    - unit: 4
      title: Desarrollo básico de software
      weeks: 7
      eje: Aplicaciones
      indicators: 14
      focus: 'Python in IDLE: syntax, conditionals, loops, functions/modularity, strings/lists/tuples/dicts, text-file I/O,
        libraries (math, random, datetime); advanced: version control'
    - unit: 5
      title: Ciberseguridad y ciudadanía digital
      weeks: 4
      eje: Sistemas
      indicators: 8
      focus: digital footprint, reputation, phishing/malware/scams, fake information and source reliability, passwords, privacy
        settings, empathy online, cyberbullying, reporting
    - unit: 6
      title: Fundamentos de inteligencia artificial
      weeks: 6
      eje: Datos
      indicators: 12
      focus: what AI is; ML basics; computer vision and image generation via pseudocode simulation; rule-based vs AI chatbots;
        data role; supervised (trees, rules, k-NN, linear regression) and unsupervised (clustering); neural networks; generative
        AI; ethics
    entry_profile_verbatim: Para un desarrollo adecuado de las competencias planteadas es indispensable la construcción previa
      de habilidades fundamentales como la resolución de problemas, la búsqueda de información, la representación de datos
      numéricos y el ensamblaje de dispositivos siguiendo instrucciones. Estas habilidades deberán fomentarse en los años
      previos como parte del perfil de entrada a Educación Media.
    declared_feeder_subjects_verbatim: integra y expande las competencias promovidas durante la Educación Básica, principalmente
      en las asignaturas de Matemática y Datos y Ciencia y Tecnología
    note_on_feeders: '''Matemática y Datos'' is the 2026 title of the III-ciclo mathematics programme (mined_mat_2026_iii_ciclo).
      The 2.º-ciclo mathematics programme (2026) is titled ''Aritmética y finanzas'' in its running header and includes data
      units (4.º U9 ''Medida y representación de datos''; 6.º U7 ''Análisis de datos''; 6.º U11 ''Formas de contar y ordenar
      objetos''). The word ''algoritmo'' appears 31 times in the 2.º-ciclo maths programme, always as ''algoritmo de la división/multiplicación''
      (arithmetic procedures), never as computational algorithm design.'
    references_to_basica: The CC programme's bibliography cites the 2008 Programas de Estudio of 2.º, 4.º and 6.º grado de
      Educación Básica (not the 2022 CyT programme).
    retrieved_at: 2026-09-13
    confidence: high
  backward_mapping_cc_to_2a6:
    purpose: For each capability that CC 1.er año assumes on entry (explicitly in the perfil de entrada, or implicitly because
      a unit starts from it without teaching it), state where it is or is not developed in the current 2.º–6.º programmes.
      This is the vertical anchor; grade-6 exit targets are derived from it in Phase 3.
    method: Read every CC indicator; classify the prior capability it presupposes; search the 2026 CyT 2.º–6.º, CyV 2.º–6.º
      and Matemática 4.º–6.º programmes for an indicator that develops it. 'gap' = no indicator found.
    confidence: medium
    note: Implicit prerequisites are an interpretation; explicit ones are quoted. III ciclo (7–9) has no computing subject
      either, so a gap at grade 6 is a gap at grade 9 unless III ciclo is redesigned.
    rows:
    - cc_ref: perfil de entrada
