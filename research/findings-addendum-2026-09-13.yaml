    retrieved_at: 2026-09-13
    study_type: quasi_experimental
    sample: n=127 elementary teachers (USA) in a year-long continuous PD programme
    finding: Teachers' confidence grew most for sequences, algorithms and loops and least for conditionals, variables and
      functions; in CT they were strongest in pattern recognition and algorithmic reasoning and weakest in decomposition and
      abstraction.
    effect_size: n/a (not visible; publisher elided abstract)
    evidence_level: weak
    caveats: Self-efficacy (self-report) not skill; no control group; details read from a Semantic Scholar key-findings summary,
      not the abstract.
    implication_for_curriculum: A 20-40 h PD budget can realistically make generalists confident with sequence, loops and
      pattern/algorithm work (grades 1-4 content); conditionals, variables, functions and abstraction (grades 5-6 content)
      need more support, e.g. scripted lessons or specialist backup.
    confidence: medium
  - id: yadav-2014-preservice-ct
    topic: teacher_capacity
    citation: Yadav, A., Mayfield, C., Zhou, N., Hambrusch, S., & Korb, J. T. (2014). Computational thinking in elementary
      and secondary teacher education. ACM Transactions on Computing Education, 14(1), Article 5.
    source_url: https://api.crossref.org/works/10.1145/2576872
    retrieved_at: 2026-09-13
    study_type: quasi_experimental
    sample: Preservice teachers in an educational psychology course (USA); n not in abstract
    finding: A short CT module embedded in a required education course measurably improved preservice teachers' understanding
      of CT concepts and attitudes toward computing.
    effect_size: n/a
    evidence_level: weak
    caveats: Short module, self-report attitudes and concept definitions, no classroom implementation measured.
    implication_for_curriculum: Embedding a compact CT module in initial teacher education is low-cost and shifts understanding;
      pair it with in-service PD for practice.
    confidence: medium
  - id: ceibal-remote-teacher-model
    topic: teacher_capacity
    citation: Fundacion Sadosky / Program.AR (n.d.). Docentes remotos (remote teachers for Ceibal's Pensamiento Computacional
      programme, Uruguay). Web page; and Chicos.net programme page.
    source_url: https://fundacionsadosky.org.ar/docentes-remotos/
    retrieved_at: 2026-09-13
    study_type: position_paper
    sample: 'Programme description: since 2018 Argentine remote teachers, over 25,000 students in more than 350 Uruguayan
      primary schools, ages 9-12 (grades 4-6); weekly videoconference class co-taught with the classroom teacher as a ''pedagogical
      pair'' (Chicos.net page)'
    finding: Ceibal's model substitutes for teacher subject knowledge by pairing a remote specialist (one videoconference
      class per week) with the generalist classroom teacher, who co-teaches and follows up. The pages opened report reach
      and qualitative testimonials only; no student-learning impact evaluation was accessible in this session (a 2026 Ceibal
      PDF was blocked).
    effect_size: n/a
    evidence_level: anecdotal
    caveats: Provider web pages; no outcome data verified; satisfaction figures seen only in search snippets (not opened)
      are excluded.
    implication_for_curriculum: A remote-specialist plus classroom-teacher model is a feasible scaling strategy for grades
      4-6 where generalists lack knowledge, but adopt it as a design bet, not as evidence-backed.
    confidence: medium
  - id: outlier-codeorg-evaluation
    topic: teacher_capacity
    citation: 'Outlier Research & Evaluation, University of Chicago (2015-2016). Code.org evaluation (Year 1, 2014-15): elementary
      CS Fundamentals interviews and questionnaires.'
    source_url: https://outlier.uchicago.edu/evaluation_codeorg
    retrieved_at: 2026-09-13
    study_type: qualitative
    sample: US teachers implementing CS Fundamentals in 2014-15 (different samples per instrument)
    finding: The evaluation prioritised PD implementation, teacher satisfaction with PD, course implementation and teacher
      attitudinal outcomes, using interviews, surveys, focus groups and observations; the landing page presents no student-outcome
      or effect data.
    effect_size: n/a
    evidence_level: anecdotal
    caveats: Only the index page was accessible; commissioned by Code.org; attitudinal outcomes only.
    implication_for_curriculum: Existing large-scale PD evaluations of one-day CS Fundamentals workshops measure satisfaction
      and attitude, so a short-PD model cannot be claimed to be validated on pupil learning.
    confidence: high
  - id: sun-hu-zhou-2021-programming-ct-meta
    topic: integration_vs_standalone
    citation: Sun, L., Hu, L., & Zhou, D. (2021). Which way of design programming activities is more effective to promote
      K-12 students' computational thinking skills? A meta-analysis. Journal of Computer Assisted Learning, 37(4), 1048-1062.
    source_url: https://api.crossref.org/works/10.1111/jcal.12545
    retrieved_at: 2026-09-13
    study_type: meta_analysis
    sample: 86 empirical (randomised/controlled) K-12 studies, 114 effect sizes
    finding: 'Programming improved K-12 CT overall, Hedges'' g = 0.601 (95% CI [0.505, 0.697]), p < .001, with no publication
      bias detected. Moderators favouring larger effects: interdisciplinary programming integration (vs standalone programming),
      interventions of 1 week to 1 month, class sizes under 50, and deliberate choice of tools and assessment.'
    effect_size: g = 0.601, 95% CI [0.505, 0.697]
    evidence_level: moderate
    caveats: Moderator estimates for integration are not reported in the abstract; short interventions scoring higher suggests
      novelty/retest effects; CT measured with heterogeneous instruments.
    implication_for_curriculum: Integrating programming into other subjects is at least as effective as standalone for CT
      outcomes and may be more so; a hybrid (standalone spine + integrated applications) is defensible.
    confidence: high
  - id: lai-wong-2022-collaborative-meta
    topic: integration_vs_standalone
    citation: 'Lai, X., & Wong, G. K.-W. (2022). Collaborative versus individual problem solving in computational thinking
      through programming: A meta-analysis. British Journal of Educational Technology, 53(1), 150-170.'
    source_url: https://api.ies.ed.gov/eric/?search=title:%22Collaborative%20versus%20Individual%22&format=json&fields=title,author,publicationdateyear,source,description
    retrieved_at: 2026-09-13
    study_type: meta_analysis
    sample: 33 publications, 4,717 learners across educational levels
    finding: Collaborative problem solving in programming had a medium advantage over individual work on cognitive outcomes,
      Hedges' g = 0.562, p < .001.
    effect_size: g = 0.562 (CI not in abstract)
    evidence_level: moderate
    caveats: Pedagogical (not integration) moderator; mixed ages; abstract read only.
    implication_for_curriculum: Default to pair programming / small-group problem solving in both standalone and integrated
      lessons; this also halves device needs.
    confidence: high
  - id: weintrop-2016-ct-math-science
    topic: integration_vs_standalone
    citation: Weintrop, D., Beheshti, E., Horn, M., Orton, K., Jona, K., Trouille, L., & Wilensky, U. (2016). Defining computational
      thinking for mathematics and science classrooms. Journal of Science Education and Technology, 25(1), 127-147.
    source_url: https://api.ies.ed.gov/eric/?search=id:EJ1087675&format=json&fields=title,author,publicationdateyear,source,description
    retrieved_at: 2026-09-13
    study_type: position_paper
    sample: n/a (taxonomy built from literature, expert input and high-school classroom activities)
    finding: 'Defines CT-in-STEM as four practice families: data practices, modeling and simulation practices, computational
      problem-solving practices, and systems-thinking practices.'
    effect_size: n/a
    evidence_level: weak
    caveats: Developed for secondary mathematics/science; no primary validation; conceptual.
    implication_for_curriculum: For integration in grades 5-6, borrow only the data-practices and computational-problem-solving
      strands; modeling/simulation and systems thinking are secondary-level.
    confidence: high
  - id: israel-2015-schoolwide-ct
    topic: integration_vs_standalone
    citation: 'Israel, M., Pearson, J. N., Tapia, T., Wherfel, Q. M., & Reese, G. (2015). Supporting all learners in school-wide
      computational thinking: A cross-case qualitative analysis. Computers & Education, 82, 263-279.'
    source_url: https://lists.mste.illinois.edu/lists/arc/ctrl-shift/2015-02/msg00031/Computers_&_Education_Israel_et_al_2015.pdf
    retrieved_at: 2026-09-13
    study_type: qualitative
    sample: One high-need Midwestern US elementary school (K-5); classroom teachers (grades 2, 3, 4/5 split), librarian, art
      teacher and administrators; observations and interviews over four months
    finding: Classroom teachers all said curriculum pacing was too rapid to add computing as a distinct subject and therefore
      embedded it in mathematics, language arts and science (e.g. money skills in grade 2). Teachers were initially apprehensive
      but willing once given support; success depended on a 'purveyor' (the librarian) who co-planned and co-taught until
      teachers were confident; integration increased preparation time; struggling learners and students with disabilities
      benefited from collaboration and explicit scaffolds.
    effect_size: n/a
    evidence_level: weak
    caveats: Single school, no learning outcomes, purposive case selection.
    implication_for_curriculum: In a crowded primary timetable, integration is what generalists will actually do; the model
      needs a named in-school coach/co-teacher and planning time, not only materials.
    confidence: high
  - id: rich-yadav-larimore-2020-implementation-profiles
    topic: integration_vs_standalone
    citation: Rich, K. M., Yadav, A., & Larimore, R. A. (2020). Teacher implementation profiles for integrating computational
      thinking into elementary mathematics and science instruction. Education and Information Technologies, 25, 3161-3188.
    source_url: https://par.nsf.gov/servlets/purl/10183083
    retrieved_at: 2026-09-13
    study_type: qualitative
    sample: 8 US elementary teachers (grades 2-5 lessons); three PD workshops in 2018 (introduction, four CT practices, and
      a three-day lesson-planning workshop); video of 12 lesson days
    finding: Teachers created CT opportunities through framing, prompting and inviting reflection, grouped into four profiles
      (CT as general problem-solving strategies; CT to structure lessons; CT through prompting; CT to guide planning). Teachers
      saw stronger CT connections in mathematics than in science and leaned on existing CT-related vocabulary (patterns, decomposition).
    effect_size: n/a
    evidence_level: weak
    caveats: Eight teachers, no student outcomes, unplugged integration only, researchers designed the PD.
    implication_for_curriculum: With roughly a week of PD, generalists can integrate unplugged CT practices (patterns, decomposition,
      debugging, abstraction) into mathematics lessons; science integration is harder and should come later.
    confidence: high
  - id: zhang-2025-umbrella-review
    topic: integration_vs_standalone
    citation: 'Zhang, J., Wu, Y., Ning, Y., & Shi, Y. (2025). From evidence to insight: An umbrella review of computational
      thinking research syntheses. Journal of Intelligence, 13(12), 157.'
    source_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=41440818&rettype=abstract&retmode=text
    retrieved_at: 2026-09-13
    study_type: systematic_review
    sample: 33 meta-analyses and systematic reviews on CT
    finding: Across syntheses, project-based learning, text-based programming and game-based learning show more pronounced
      effects; the review criticises research quality and calls for standardising meta-analyses, unifying effect-size indicators
      and strengthening longitudinal studies.
    effect_size: n/a
    evidence_level: weak
    caveats: Abstract only; umbrella reviews inherit primary-study weaknesses; the text-based finding is mostly secondary-level.
    implication_for_curriculum: Prefer project-based units for grades 4-6; treat any single meta-analytic number as provisional
      given the field's acknowledged heterogeneity.
    confidence: medium
  - id: relkin-2020-techcheck
    topic: assessment
    citation: 'Relkin, E., de Ruiter, L., & Bers, M. U. (2020). TechCheck: Development and validation of an unplugged assessment
      of computational thinking in early childhood education. Journal of Science Education and Technology, 29, 482-498.'
    source_url: https://api.ies.ed.gov/eric/?search=title:%22TechCheck%22%20AND%20author:Relkin&format=json&fields=title,author,publicationdateyear,source,description
    retrieved_at: 2026-09-13
    study_type: instrument_validation
    sample: n=768 students aged 5-9 (USA)
    finding: Unplugged multiple-choice test of six CT domains (algorithms, modularity, control structures, representation,
      hardware/software, debugging), administrable to a whole class in under 15 minutes without programming knowledge; good
      psychometric properties and discriminates between CT ability levels. A 2023 normative follow-up (Relkin, Johnson & Bers)
      provides grade-specific norms because raw scores are not comparable across grades.
    effect_size: n/a
    evidence_level: moderate
    caveats: Developed by the ScratchJr/KIBO team; abstract-level psychometrics only were readable; ceiling effects reported
      for older children in the TLDR ('low for second graders').
    implication_for_curriculum: TechCheck (or K/1/2 variants) can anchor grade 1-3 assessment of unplugged CT recognition
      skills; use grade norms, not raw cut scores.
    confidence: high
  - id: zapata-caceres-2020-bctt
    topic: assessment
    citation: 'Zapata-Caceres, M., Martin-Barroso, E., & Roman-Gonzalez, M. (2020). Computational Thinking Test for Beginners:
      Design and content validation. Proceedings of IEEE EDUCON 2020, 1905-1914.'
    source_url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1109/EDUCON45650.2020.9125368?fields=title,authors,year,venue,abstract,tldr
    retrieved_at: 2026-09-13
    study_type: instrument_validation
    sample: Primary-school students in Spain (n not in abstract); expert-judgement content validation
    finding: The Beginners CT test (BCTt), derived from the CTt and aimed at early ages (about 5-10), was judged adequate
      by experts and showed high reliability in primary school, 'particularly in first educational stages'.
    effect_size: n/a
    evidence_level: weak
    caveats: Content validation and reliability only in this paper; abstract read; later work by the same group (cCTt) supersedes
      it for grades 3-6.
    implication_for_curriculum: BCTt is a candidate for grades 1-3 assessment of sequences, loops and simple conditionals
      in a maze/canvas format.
    confidence: medium
  - id: el-hamamsy-2025-cctt
    topic: assessment
    citation: 'El-Hamamsy, L., Zapata-Caceres, M., Martin-Barroso, E., Mondada, F., Dehler Zufferey, J., Bruno, B., & Roman-Gonzalez,
      M. (2025). The competent Computational Thinking test (cCTt): A valid, reliable and gender-fair test for longitudinal
      CT studies in grades 3-6. Technology, Knowledge and Learning.'
    source_url: https://api.ies.ed.gov/eric/?search=author:Rom%C3%A1n-Gonz%C3%A1lez%20AND%20title:%22Computational%20Thinking%20Test%22&format=json&fields=title,author,publicationdateyear,source,description
    retrieved_at: 2026-09-13
    study_type: instrument_validation
    sample: n=2,709 students, grades 3-6 (Switzerland)
    finding: Validated with Classical Test Theory, Item Response Theory and measurement-invariance analyses; reliable and
      gender-fair across grades 3-6, with proficiency benchmarks and equivalency scales for longitudinal use.
    effect_size: n/a
    evidence_level: strong
    caveats: Abstract read; measures the CTt construct (sequences, loops, conditionals, functions in block-like maze/canvas
      items), not creative or collaborative CT.
    implication_for_curriculum: cCTt is the best-evidenced anchor for grades 3-6 and allows tracking growth across years;
      align our grade 3-6 micro-skills to its item families.
    confidence: high
  - id: roman-gonzalez-2017-ctt
    topic: assessment
    citation: Roman-Gonzalez, M., Perez-Gonzalez, J.-C., & Jimenez-Fernandez, C. (2017). Which cognitive abilities underlie
      computational thinking? Criterion validity of the Computational Thinking Test. Computers in Human Behavior, 72, 678-691.
    source_url: https://api.crossref.org/works/10.1016/j.chb.2016.08.047
    retrieved_at: 2026-09-13
    study_type: instrument_validation
    sample: Spanish students aged 10-16 (n not readable; abstract elided by publisher)
    finding: Existence and venue confirmed via Crossref; Semantic Scholar's TLDR states results link CT to components of the
      Cattell-Horn-Carroll model and support CT as a problem-solving ability. The Brackmann 2017 paper (opened) describes
      the CTt as validated for students from 10 to 16 years old and covering sequences, loops, conditionals (including nested),
      functions and debugging in visual-block items.
    effect_size: n/a
    evidence_level: weak
    caveats: Abstract not accessible; details are second-hand from a paper using the instrument.
    implication_for_curriculum: CTt is appropriate only from about grade 5 (age 10); for younger grades use BCTt/cCTt/TechCheck
      instead.
    confidence: medium
  - id: zhang-wong-2023-cttlp
    topic: assessment
    citation: Zhang, S., & Wong, G. K. W. (2023). Development and validation of a computational thinking test for lower primary
      school students. Educational Technology Research and Development, 71, 1595-1630.
    source_url: https://api.ies.ed.gov/eric/?search=title:%22lower%20primary%20school%20students%22%20AND%20title:%22computational%20thinking%20test%22&format=json&fields=title,author,publicationdateyear,source,description
    retrieved_at: 2026-09-13
    study_type: instrument_validation
    sample: n=1,225 students in grades 1-3 (ages 6-10), Hong Kong; constructed-response items
    finding: Test validated via expert review, cognitive interviews, CTT and IRT; performance improved with grade and no gender
      difference; children had particular difficulty with loop control and with executing sequences involving multiple directions.
    effect_size: n/a
    evidence_level: moderate
    caveats: Abstract read; single region; constructed-response format needs trained scoring.
    implication_for_curriculum: For grades 1-3, define 'loop control' and 'multi-direction sequencing' as stretch micro-skills,
      not baseline expectations.
    confidence: high
  - id: moreno-leon-2015-dr-scratch
    topic: assessment
    citation: 'Moreno-Leon, J., Robles, G., & Roman-Gonzalez, M. (2015). Dr. Scratch: Automatic analysis of Scratch projects
      to assess and foster computational thinking. RED. Revista de Educacion a Distancia, 46, Article 10.'
    source_url: https://www.um.es/ead/red/46/moreno_robles.pdf
    retrieved_at: 2026-09-13
    study_type: instrument_validation
    sample: 'Tool study: 100 random public Scratch projects; user study: n=109 students aged 10-14 (mean 11.5), mostly primary
      (68.8%)'
    finding: Dr. Scratch scores seven dimensions (abstraction/decomposition, logical thinking, synchronization, parallelism,
      flow control, user interactivity, data representation) at 0-3 each from static code analysis; of 100 random projects
      79% had non-personalised sprite names and 62% repeated code. In the user study, students who received Dr. Scratch feedback
      improved project scores pre-to-post, with significant pre/post correlations; the paper acknowledges the tool measures
      code features, not understanding.
    effect_size: n/a
    evidence_level: weak
    caveats: Artefact metrics reward block usage (e.g. one 'if' scores logic) and can be gamed; no evidence it reflects what
      children understand; authors are the tool developers.
    implication_for_curriculum: Use Dr. Scratch only as a formative, low-stakes signal of project complexity in grades 4-6,
      never as a summative CT measure.
    confidence: high
  - id: hubwieser-muhling-2015-bebras-psychometrics
    topic: assessment
    citation: 'Hubwieser, P., & Muhling, A. (2015). Investigating the psychometric structure of Bebras contest: Towards measuring
      computational thinking skills. Proceedings of LaTiCE 2015, 62-69.'
    source_url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1109/LaTiCE.2015.19?fields=title,authors,year,venue,abstract,tldr
    retrieved_at: 2026-09-13
    study_type: instrument_validation
    sample: Bebras contest response data (Germany); n not accessible
    finding: Existence and venue confirmed (Crossref and Semantic Scholar); abstract elided by publisher. Bebras tasks are
      contest items, not a validated test; this paper is the standard citation for treating them psychometrically. A separate
      small study (Chiazzese et al. 2019, Informatics 6(4):43, n=51 vs 32, read via Crossref abstract) used Bebras tasks as
      an outcome for primary robotics and found larger effects for third graders.
    effect_size: n/a
    evidence_level: weak
    caveats: Could only confirm the paper exists; Bebras difficulty varies by year and task; no primary-school norms verified.
    implication_for_curriculum: Use Bebras-style tasks for practice and classroom formative checks, but do not use raw Bebras
      scores as a validated CT measure without local calibration.
    confidence: low
  synthesis:
  - statement: 'Teachable at age 7 (grade 2): precise ordered instructions (sequence), recognising simple patterns, simple
      event-action pairs, decomposition of everyday tasks, and unplugged debugging as ''find the wrong step''; loop control
      and multi-direction sequences are stretch goals, and variables/state are not appropriate.'
    supported_by:
    - franklin-2017-conceptual-sequencing
    - seiter-foreman-2013-pect
    - zhang-wong-2023-cttlp
    - kazakoff-2013-sequencing-robotics
    - wang-2024-meta-ages-3-8
    - rich-2017-k8-trajectories
    evidence_level: moderate
  - statement: 'Teachable at age 9 (grade 4): repetition with counts, initialization and program state (initialize-then-change),
      coordinating two or three scripts/events, decomposition as plan-then-build, and systematic debugging with execution
      feedback; simple conditionals can begin but nested/conditional-repetition should wait.'
    supported_by:
    - seiter-foreman-2013-pect
    - franklin-2017-conceptual-sequencing
    - rich-2017-k8-trajectories
    - rich-2019-debugging-trajectory
    - sun-yang-becker-2024-debugging-meta
    evidence_level: moderate
  - statement: 'Teachable at age 11 (grade 6): conditionals including nested, variables as single-value containers used for
      counting/scoring, Boolean operators, procedures/custom blocks, and CTt-type transfer items; even here, projects can
      be completed without understanding variables, loops and Booleans, so conceptual assessment is mandatory.'
    supported_by:
    - grover-basu-2017-block-misconceptions
    - meerbaum-salant-2013-scratch-concepts
    - seiter-foreman-2013-pect
    - brackmann-2017-unplugged-spain
    - el-hamamsy-2025-cctt
    evidence_level: moderate
  - statement: 'Design explicitly against five misconceptions: the ''superbug'' (an intelligent interpreter inside the machine),
      parallel execution of sequential lines, a variable holding several values or its name carrying meaning, loops producing
      the same output every iteration, and programs ''waiting'' intelligently for input; teach a named notional machine and
      use prediction/tracing tasks at every grade.'
    supported_by:
    - pea-1986-superbug
    - swidan-2018-school-misconceptions
    - grover-basu-2017-block-misconceptions
    - meerbaum-salant-2013-scratch-concepts
    - sorva-2013-notional-machines
    - qian-lehman-2017-review
    evidence_level: moderate
  - statement: Unplugged teaching is defensible as (a) the opening weeks of each grade and (b) the main mode for grades 1-2,
      and roughly 10 hours of well-designed unplugged work moves CT test scores in grades 5-6; but it is not shown to be superior
      to conventional teaching, its pooled effect sizes above 1.0 are implausible, and programming-based interventions show
      larger CT gains, so unplugged should be a strand (perhaps 30-40% of time in grades 1-3, less later), not the programme.
    supported_by:
    - brackmann-2017-unplugged-spain
    - hermans-aivaloglou-2017-scratch-or-not
    - del-olmo-munoz-2020-unplugged-then-plugged
    - chen-2023-unplugged-meta
    - bell-vahrenhold-2018-cs-unplugged
    - merino-armero-2022-ct-meta
    - huang-looi-2021-unplugged-review
    evidence_level: moderate
  - statement: 'Unplugged work does not teach debugging-with-feedback or state/variables well: the strongest debugging interventions
      use enhanced debuggers and systematic instruction, one small study found debugging was the only domain where a ScratchJr
      group did not outperform controls, and initialization/state proficiency appears only with plugged practice around grades
      3-4; plan plugged time for these from grade 3.'
    supported_by:
    - sun-yang-becker-2024-debugging-meta
    - louka-papadakis-2024-scratchjr
    - seiter-foreman-2013-pect
    - rich-2019-debugging-trajectory
    evidence_level: weak
  - statement: 'Transfer claims we may make: programming plausibly supports mathematics, creative thinking and metacognition
      (moderate pooled effects). Claims we may not make: gains in literacy or general school achievement, or that CT ''makes
      children better thinkers'' in general, because far-transfer estimates shrink with active controls and are inflated by
      publication bias, and general far transfer rarely survives good designs.'
    supported_by:
    - scherer-2019-transfer-meta
    - sala-gobet-2017-far-transfer
    - denning-2017-trouble-spots
    - popat-starkey-2019-review
    evidence_level: strong
  - statement: A realistic PD budget for generalists is 20-40 hours in year one, which reliably raises confidence for sequence,
      loops, patterns and algorithms (grades 1-4 content) but not for conditionals, variables, functions and abstraction;
      grade 5-6 content needs either recurring CPD (the 35 h/year norm), scripted lessons, an in-school coach/co-teacher,
      or a remote specialist model, and self-reported confidence must not be read as pupil learning.
    supported_by:
    - rich-mason-oleary-2021-teacher-self-efficacy
    - royal-society-2017-after-the-reboot
    - ncce-2022-impact-report
    - sentance-csizmadia-2017-teacher-challenges
    - israel-2015-schoolwide-ct
    - ceibal-remote-teacher-model
    - outlier-codeorg-evaluation
    evidence_level: moderate
  - statement: 'Integration versus standalone: integrating programming into other subjects is at least as effective for CT
      as standalone (meta-analytic moderator), generalists in crowded timetables will only implement integrated or short standalone
      units, and with about a week of PD they can integrate unplugged CT practices into mathematics (science is harder); a
      hybrid of a small standalone spine plus mathematics-integrated applications, taught in pairs, is the best-supported
      design.'
    supported_by:
    - sun-hu-zhou-2021-programming-ct-meta
    - israel-2015-schoolwide-ct
    - rich-yadav-larimore-2020-implementation-profiles
    - lai-wong-2022-collaborative-meta
    - weintrop-2016-ct-math-science
    - zhang-2025-umbrella-review
    evidence_level: moderate
  - statement: 'Assessment anchors per grade band: grades 1-2 TechCheck-K/1 or BCTt (unplugged, multiple choice, under 15
      minutes, use grade norms); grades 3-6 the cCTt (validated n=2,709, IRT, longitudinal scales); from grade 5 the CTt (ages
      10-16) if comparability with secondary is needed; Dr. Scratch and Bebras only as formative, uncalibrated signals. An
      ''assessable micro-skill'' is therefore an item family these instruments already contain (e.g. ''completes a repeat-n
      loop in a maze'', ''predicts the output of a nested if'').'
    supported_by:
    - relkin-2020-techcheck
    - zapata-caceres-2020-bctt
    - el-hamamsy-2025-cctt
    - roman-gonzalez-2017-ctt
    - zhang-wong-2023-cttlp
