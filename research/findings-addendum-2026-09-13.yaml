  - id: scherer-2019-transfer-meta
    topic: transfer
    citation: 'Scherer, R., Siddiq, F., & Sanchez Viveros, B. (2019). The cognitive benefits of learning computer programming:
      A meta-analysis of transfer effects. Journal of Educational Psychology, 111(5), 764-792.'
    source_url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1037/edu0000314?fields=title,authors,year,venue,abstract,tldr
    retrieved_at: 2026-09-13
    study_type: meta_analysis
    sample: 105 studies, 539 effect sizes (3-level random-effects), learners from kindergarten to adulthood
    finding: Overall transfer g = 0.49 (95% CI [0.37, 0.61]); near transfer g = 0.75 [0.39, 1.11]; far transfer g = 0.47 [0.35,
      0.59]. Positive transfer was found for creative thinking, mathematical skills and metacognition, then spatial skills
      and reasoning; school achievement and literacy benefited least. Effects were significantly larger with untreated (passive)
      than with active control groups, and larger in published than grey literature.
    effect_size: overall g = 0.49 [0.37, 0.61]; near g = 0.75 [0.39, 1.11]; far g = 0.47 [0.35, 0.59]
    evidence_level: moderate
    caveats: Passive-control inflation and publication/grey-literature gap both point to overestimation; the far-transfer
      estimate mixes ages and outcome types; the abstract does not report domain-specific CIs (APA page blocked).
    implication_for_curriculum: We may claim programming supports mathematics, creative thinking and metacognition as plausible
      secondary benefits, but must state effects are moderate and inflated by weak designs; we may not claim literacy or general
      school-achievement gains.
    confidence: high
  - id: popat-starkey-2019-review
    topic: transfer
    citation: Popat, S., & Starkey, L. (2019). Learning to code or coding to learn? A systematic review. Computers & Education,
