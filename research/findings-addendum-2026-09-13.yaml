    - cc_ref: U2 2.9–2.10 (depuración)
      assumed_capability: Treating errors as information; systematic testing
      explicit: false
      present_in_2a6: CyT attitudinal 'Asunción de errores', profile 5.11/6.11 'Adecuar procedimientos para mejorar resultados
