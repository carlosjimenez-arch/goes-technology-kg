  new_evidence_not_in_primary:
  - Ciudadanía y Valores (2026) carries a digital-citizenship block in 3.º U6 (6.5), 4.º U6 (6.13–6.15) and 5.º U6 (6.9–6.12),
    and names "ciudadanía digital y la seguridad" in the 6.º competencies; weekly load 3 h (2.º) / 4 h (3.º–6.º). This is
    the natural host subject for the B strand under transversal/hybrid modes, with ~4 indicators per grade already in place.
  - 'Matemática II ciclo (2026, PDF dated 2026-03-25): 5 h/week, 200 h/year in 4.º–6.º; data units 4.º U9, 6.º U7, 6.º U11;
    "algoritmo" appears 31 times, always as arithmetic procedure. The III-ciclo programme is titled "Matemática y datos",
    which is the feeder subject the CC programme names.'
  - CyT technology axis in 7.º–11.º stays physics/biotech (9.º Electricidad, Magnetismo aplicado; 10.º Electromagnetismo;
    11.º Biotecnología ×2, Ciencia de materiales). No computing in CyT at any level; the vertical computing chain has a 7-year
    gap (grades 3–9) with no host.
  - 'CC programme bibliography cites the 2008 Programas de Estudio (2.º, 4.º, 6.º), not the 2022 CyT programme: the CC authors
    did not backward-map from the current primary curriculum.'
  - Diario El Mundo 2024-01-29 documents the 2024 III-ciclo rollouts (Lenguaje, CyT, Estudios Sociales, Inglés) and Educación
    Física for 2.º–3.º and II ciclo, "para su uso y validación".
  - 'Orientaciones 2026 renames the primary subjects: Comunicación (2.º–3.º) / Comunicación y Literatura (4.º–6.º), Números
    y Formas (2.º–3.º) / Aritmética y Finanzas (4.º–6.º), Ciencia y Tecnología, Ciudadanía y Valores, Artes, Desarrollo Corporal;
    total 25 h/week; no Tecnología/Informática/Computación row in any grade 2–6. III ciclo: Matemática y Datos 5 h. Bachillerato
    general 1.º año 38 h including Ciencias de la Computación 4 h.'
  - 'Connectivity is the sharpest official-vs-independent gap: Presidencia/UNDP ">90 % of schools connected, >4,700 schools"
    and "80 % with Starlink" (2025) versus World Bank PID (Nov 2025) "57 % of schools lack internet" and ESSA (Feb 2026) "one
    in four with stable connectivity"; MINEDUCYT declared the list of connected schools reserved information in 2023. This
    supports T0/T1 as the design floor.'
  - 'No official or independent measurement of the working share of the 2021–23 device fleet exists; only repair-centre figures
    and a 2025 maintenance tender. World Bank ESSA: under 20 % of teachers trained in pedagogical use of technology.'
  - 'AI policy: Ley de Fomento a la IA (D.L. 234, D.O. 2025-03-03) and ANIA exist; a national AI strategy was announced (UNESCO,
    Jun 2026) but no document is published → status partial. Digital-competence framework for students or teachers: absent
    (only Política TIC 2014).'
  - 'School calendars: 2025 = 20 Jan–7 Nov, 2026 = 2 Feb–13 Nov, 40 numbered weeks; the World Bank refers to 200 school days.'
  discrepancies:
  - None material. This session initially computed 86 T-axis hours (arithmetic slip on grade 6); corrected to 90 after cross-check,
    in agreement with the primary file.
  - 'Orientaciones 2026 weekly table lists Ciencia y Tecnología at 4 h in BOTH 2.º and 3.º (primer ciclo table: 2.º 7/6/4/3/2/3,
    3.º 6/6/4/4/2/3 = 25 h), whereas the CyT programme (2022 and 2026 editions) states 4 h in 2.º and 5 h in 3.º. Both are
    official documents; record both, do not average. The 2026 table is the timetable instrument, so host capacity for 3.º
    should use 4 h until MINED clarifies.'
decision_review_notes:
  purpose: The maintainer asked for critique, not confirmation. These notes do not change decisions 0001–0003; they list points
    the maintainer may want addressed before Phase 4/5 implementation.
  d0001_subject_scope:
  - role: curriculum_designer
    note: Option D with A weight 0.40 (grades 2–3) and 0.25 (grades 4–6) assumes CyT can host strand A. CyT has no T-axis
      unit in grade 5, so under transversal/hybrid modes strand A in grade 5 has zero native host capacity; either the ledger
      borrows from non-T CyT units (Magnitudes físicas, Mecánica) with explicit justification, or the grade-5 A weight should
      be lower. Make this an explicit test vector.
  - role: ct_researcher
    note: Option B is scored t0_feasibility=1, which treats B as operational digital competence. Its citizenship/safety/source-evaluation
      half is T0-teachable and is already hosted by Ciudadanía y Valores from grade 3. Consider splitting B into B1 (citizenship
      and judgement, T0, host CyV) and B2 (operations, T2+), so the weight and the tier analysis stop conflating them.
  - role: ai_engineer
    note: 0001 embeds budget_policy, but CLAUDE.md §4 still names decisions/0002-time-budget-policy.yaml and §5 names 0003-graph-vocabulary.yaml;
      0002 is capability tiers and 0003 is knowledge structure. Either split budget policy into its own numbered decision
      or fix the two references so the enforcement test for decision references resolves.
  - role: graph_researcher
    note: The weighted scores (A 3.45, B 2.45, C 3.85, D 4.2) are sensitive to the 0.30 weight on vertical_alignment; with
      equal weights D still wins (4.2 vs 3.8 for C), so the choice is robust, but record the sensitivity check rather than
      only the point scores.
  - role: ct_researcher
    note: 'Second learning-science retrieval (51 records) supports the early-CT position of 0001 but bounds it: at age 7 sequence/patterns/find-the-wrong-step
      only; variables and state not before grade 4; nested conditionals and Booleans at grade 6 with mandatory conceptual
      assessment (projects get completed without understanding). Transfer claims allowed: mathematics, creative thinking,
      metacognition (Scherer 2019 g=0.49 [0.37,0.61], inflated by passive controls); not allowed: literacy, general achievement.
      Integration is at least as effective as standalone (Sun, Hu & Zhou 2021 g=0.60), which favours hybrid/transversal delivery.'
  d0002_capability_tiers:
  - role: curriculum_designer
    note: 'Agreed that strict full-anchor T0 equivalence is infeasible and should be reported as failed. One addition: the
      CyT programme itself already requires real instruments (multimeter in 6.º U3), so a T0 variant for the A strand will
      lose performances that the official CyT indicators demand; the practical_bridge for those should point to the CyT unit,
      not to a new Technology activity, to avoid double time.'
  - role: ai_engineer
    note: required_capabilities is the right generalisation of tiers; make sure the solver reads capabilities, not the ordinal
      tier, when checking feasibility, otherwise T3-without-multimeter passes.
  - role: ct_researcher
    note: 'Unplugged evidence: defensible as opening weeks of each grade and main mode in grades 2–3 (~10 h moved CTt scores
      in grades 5–6, d≈0.80 within-group), but it does not teach debugging-with-feedback or state/variables well; plan plugged
      (T1+) time for those from grade 3. This matches 0002''s conceptual-T0-with-practical-bridge choice and gives the bridge
      a concrete content list.'
  d0003_knowledge_structure:
  - role: graph_researcher
    note: goes-natural-science-kg (CLAUDE.md, Phase 2 amendments dated 2026-09-14) fixed its edge enum as PREREQUISITE / CO_REQUISITE
      / REFINES / TRANSFERS_TO and explicitly deferred AND/OR groups. The sibling_mapping in 0003 maps to math only; add the
      science mapping (co_learning_group ≈ CO_REQUISITE; dependency_rule has no counterpart there) so the four repositories
      can exchange graphs.
  - role: curriculum_designer
    note: The grade_move_case uses synthetic maths grades. The Matemática II ciclo programme retrieved here can replace them
      with real unit references (e.g. coordinates are not a named unit in 4.º–6.º; the data units are 4.º U9, 6.º U7/U11).
