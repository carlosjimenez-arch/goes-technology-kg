    effect_size: n/a (thematic synthesis)
    evidence_level: weak
    caveats: Very small corpus, qualitative synthesis, no effect sizes, outcome measures heterogeneous.
    implication_for_curriculum: Secondary outcomes (collaboration, persistence) should be designed for explicitly (pair work,
      reflection) rather than assumed to emerge from coding.
    confidence: high
  - id: sala-gobet-2017-far-transfer
    topic: transfer
    citation: Sala, G., & Gobet, F. (2017). Does far transfer exist? Negative evidence from chess, music, and working memory
      training. Current Directions in Psychological Science, 26(6), 515-520.
    source_url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1177/0963721417712760?fields=title,authors,year,venue,abstract,tldr
    retrieved_at: 2026-09-13
    study_type: meta_analysis
    sample: Three meta-analyses (chess, music, working-memory training) on children's cognitive and academic outcomes
    finding: Small-to-moderate pooled effects that shrink as design quality rises (especially with active controls); the authors
      conclude that far transfer of learning rarely occurs and extend the argument to spatial, brain and video-game training.
    effect_size: n/a in abstract (small-to-moderate, inversely related to design quality)
    evidence_level: strong
    caveats: Not about programming; the relevance is the general pattern that far-transfer effects are largely design artefacts,
      which matches the passive-control inflation in scherer-2019.
    implication_for_curriculum: Do not justify the subject by far transfer ('coding makes children smarter'); justify it by
      the CT/digital competences it directly teaches.
