    unit_of_hours: hora (as printed); the programme does not state the minute length of a class hour
    source_id: mined_cyt_2026_2a6
    quote: Ciencia y Tecnología se desarrolla en cinco horas por semana durante el año lectivo, el cual comprende 40 semanas.
      La excepción es el segundo grado, que contempla únicamente cuatro horas por semana.
    quote_2: el tiempo efectivo de las clases se ajusta a 32 semanas, contemplándose 8 semanas para las adecuaciones curriculares
    retrieved_at: 2026-09-13
    confidence: high
    note: 'Same table in the 2022 edition (mined_cyt_2022_2a6). Observe: 160 h/year is exactly the 2.º grado CyT allocation
      and exactly the Ciencias de la Computación allocation in bachillerato (4 h × 40).'
