    - cc_ref: U1 1.6–1.8 (algoritmos; entrada/proceso/salida; diagramas de flujo y pseudocódigo)
      assumed_capability: Writing and following an unambiguous ordered sequence of instructions; reading a simple flowchart
      explicit: false
      present_in_2a6: CyT 6.º U3 attitudinal content 'seguir secuencias de instrucciones para ensamblar dispositivos'; 2.º
        U5 5.7 'Registra las tareas necesarias para el cuidado de un animal doméstico' (a procedure list)
      gap: No indicator on authoring an algorithm or representing it; the CC programme starts flowcharts from zero in week
