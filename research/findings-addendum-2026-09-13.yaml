learning_science_second_retrieval:
  note: Independent retrieval (2026-09-13). Publisher sites (ACM, Elsevier, Springer, T&F, Sage, APA) blocked; records read
    via open PDFs, ERIC, Crossref and Semantic Scholar APIs; evidence_level and caveats state when only an abstract was readable.
  records:
  - id: pea-1986-superbug
    topic: misconceptions
    citation: Pea, R. D. (1986). Language-independent conceptual 'bugs' in novice programming. Journal of Educational Computing
      Research, 2(1), 25-36. (Read via the 1984 Technical Report No. 31 record in ERIC.)
    source_url: https://api.ies.ed.gov/eric/?search=title:%22Language-Independent%20Conceptual%20Bugs%22&format=json&fields=title,author,publicationdateyear,source,description
    retrieved_at: 2026-09-13
    study_type: position_paper
    sample: n/a (synthesis of observations of novices from primary school to college, mainly Logo/BASIC era)
    finding: 'Identifies three language-independent bug classes: parallelism (belief that several lines execute at once),
      intentionality (program has goals/foresight) and egocentrism (child assumes the machine knows what they meant). All
      are rooted in a ''superbug'': the default belief that there is a hidden intelligent mind inside the machine that interprets
      the program.'
    effect_size: n/a
    evidence_level: moderate
    caveats: Conceptual synthesis with illustrative observations, not a controlled study; only the abstract/record was read
      (Sage page blocked); 1980s languages, but the classes are repeatedly rediscovered in Scratch studies (see swidan-2018,
      meerbaum-salant-2013).
    implication_for_curriculum: Every grade band needs explicit work on 'the computer is a literal, one-step-at-a-time executor
      with no mind', e.g. act-it-out tracing where the human robot may only do exactly what is written.
    confidence: high
  - id: sorva-2013-notional-machines
    topic: misconceptions
    citation: Sorva, J. (2013). Notional machines and introductory programming education. ACM Transactions on Computing Education,
      13(2), Article 8.
    source_url: https://api.ies.ed.gov/eric/?search=title:%22Notional%20Machines%20and%20Introductory%20Programming%20Education%22&format=json&fields=title,author,publicationdateyear,source,description
    retrieved_at: 2026-09-13
    study_type: systematic_review
    sample: n/a (literature review, mostly university novices)
    finding: Synthesises misconception research, mental-model theory, constructivism, phenomenography and threshold concepts
      around the 'notional machine' (an abstract model of how programs execute). Argues the notional machine should be an
      explicit learning objective rather than left implicit, because many misconceptions are inaccurate models of execution
      dynamics.
    effect_size: n/a
    evidence_level: moderate
    caveats: Narrative review; evidence base is mainly tertiary text-based programming; only the abstract was read (ACM DL
      blocked).
    implication_for_curriculum: 'Name and teach a simple notional machine for each tool used (e.g. for Scratch: scripts, events,
      one instruction at a time per script, several scripts concurrently) and assess students'' ability to predict execution,
      not only to build artefacts.'
    confidence: high
  - id: swidan-2018-school-misconceptions
    topic: misconceptions
    citation: Swidan, A., Hermans, F., & Smit, M. (2018). Programming misconceptions for school students. Proceedings of ICER
      '18, 151-159.
    source_url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1145/3230977.3230995?fields=title,authors,year,venue,abstract,tldr
    retrieved_at: 2026-09-13
    study_type: quasi_experimental
    sample: n=145 children aged 7-17 with some programming experience (Netherlands); multiple-choice Scratch questionnaire
      covering 11 known misconceptions
    finding: 'Top three misconceptions: difficulty understanding the sequentiality of statements, that a variable holds one
      value at a time, and the interactivity of a program when user input is required. Holding a misconception was influenced
      by the mathematical effect of numbers, semantic meaning of identifiers and high expectations of what a computer can
      do. Older children answered more correctly, especially for variables and control; children who programmed in Scratch
      only did worse than those who also knew another language.'
    effect_size: n/a (descriptive prevalence)
    evidence_level: moderate
    caveats: Cross-sectional, convenience sample, wide age span, self-developed instrument; abstract-level read only (ACM
      DL blocked).
    implication_for_curriculum: 'Design against three specific bugs: (a) sequence as simultaneous, (b) variable as holding
      several values/its name having meaning, (c) programs ''waiting'' intelligently for input; use concept-rich, varied exercises
      per concept rather than one project per concept.'
    confidence: high
  - id: meerbaum-salant-2013-scratch-concepts
    topic: misconceptions
    citation: Meerbaum-Salant, O., Armoni, M., & Ben-Ari, M. (2013). Learning computer science concepts with Scratch. Computer
      Science Education, 23(3), 239-264.
    source_url: https://api.ies.ed.gov/eric/?search=title:%22Learning%20Computer%20Science%20Concepts%20with%20Scratch%22&format=json&fields=title,author,publicationdateyear,source,description
    retrieved_at: 2026-09-13
    study_type: design_study
    sample: Middle-school students in a few Israeli schools over two years (n not given in abstract)
    finding: Students could learn important CS concepts in Scratch (tests built on a revised Bloom x SOLO taxonomy), but there
      were persistent problems with repeated execution (loops), variables and concurrency; the authors attribute part of this
      to Scratch's affordances and propose changes to the teaching process.
    effect_size: n/a
    evidence_level: moderate
    caveats: Only abstract read; middle school, not primary; no control group; instrument author-developed.
    implication_for_curriculum: Loops, variables and concurrency are the three concepts most likely to be 'used but not understood'
      in Scratch; plan explicit conceptual lessons and prediction tasks for them, not only project time.
    confidence: high
  - id: grover-basu-2017-block-misconceptions
    topic: misconceptions
    citation: 'Grover, S., & Basu, S. (2017). Measuring student learning in introductory block-based programming: Examining
      misconceptions of loops, variables, and Boolean logic. Proceedings of SIGCSE ''17, 267-272.'
    source_url: https://www.computacional.com.br/files/Artigos/GROVER%20-%20Measuring%20Student%20Learning%20in%20Introductory%20Block-Based%20Programming.pdf
    retrieved_at: 2026-09-13
    study_type: instrument_validation
    sample: n=100 6th-8th graders (USA) who had completed an introductory Scratch course; plus cognitive think-alouds
    finding: After a Scratch course students were generally unfamiliar with variables and held misconceptions about them (e.g.
      a variable is a letter used as a shorthand), had trouble with how loops work (e.g. expecting a loop body to produce
      the same output every iteration; fewer than 4% answered item 8d, on loop iteration, correctly) and with Boolean operators
      (confusing OR with exclusive OR).
    effect_size: n/a
    evidence_level: moderate
    caveats: Pilot assessment, single site, middle school, item-level percentages only; authors are also the curriculum designers.
    implication_for_curriculum: Completing Scratch projects does not imply understanding of variables/loops/Booleans; grades
      5-6 need targeted conceptual items (trace a loop with a changing variable) in formative assessment.
    confidence: high
  - id: franklin-2017-conceptual-sequencing
    topic: misconceptions
    citation: Franklin, D., Skifstad, G., Rolock, R., Mehrotra, I., Ding, V., Hansen, A., Weintrop, D., & Harlow, D. (2017).
      Using upper-elementary student performance to understand conceptual sequencing in a blocks-based curriculum. Proceedings
      of SIGCSE '17, 231-236.
    source_url: https://terpconnect.umd.edu/~weintrop/papers/Franklin_et_al_SIGCSE2017.pdf
    retrieved_at: 2026-09-13
    study_type: design_study
    sample: n=123 students, ages 9-12, grades 4-6, one US elementary school, all completing Module 1 of the LaPlaya (Scratch-derived)
      curriculum
    finding: 'For simple concepts there was little difference between grades: over 90% of 4th-6th graders completed sequencing
      tasks and over 85% simple 2-D grid tasks; multiple events with one action each were accessible to all grades. Students
      understood basic concepts but were challenged by deeper applications (initialization, event/parallel coordination) and
      by non-CS prerequisites (mathematics such as coordinates), with 4th and 5th graders struggling slightly more; the authors
      argue concepts need to be articulated by grade, not grade band, and revisited over several years.'
    effect_size: n/a (completion rates)
    evidence_level: moderate
    caveats: Single school, no control, completion used as proxy for understanding, curriculum authors are evaluators.
    implication_for_curriculum: Sequence and simple events are safe at grade 4; initialization and coordinating multiple scripts
      should be spiralled across grades 4-6, and math prerequisites (coordinates, negative numbers) should be checked before
      tasks that depend on them.
    confidence: high
  - id: qian-lehman-2017-review
    topic: misconceptions
    citation: 'Qian, Y., & Lehman, J. (2017). Students'' misconceptions and other difficulties in introductory programming:
      A literature review. ACM Transactions on Computing Education, 18(1), Article 1.'
    source_url: https://api.crossref.org/works/10.1145/3077618
    retrieved_at: 2026-09-13
    study_type: systematic_review
    sample: n/a (literature review, mostly secondary/tertiary text-based programming)
    finding: Students show misconceptions across syntactic, conceptual and strategic knowledge; contributing factors include
      unfamiliar syntax, natural-language interference, mathematics knowledge, inaccurate mental models, lack of strategies,
      the programming environment and teachers' knowledge/instruction; many difficulties trace to prior knowledge. Recommends
      moving from documenting misconceptions to conceptual-change teaching and building teachers' pedagogical content knowledge
      about misconceptions.
    effect_size: n/a
    evidence_level: moderate
    caveats: Narrative review; primary-school evidence is thin in the corpus; read from Crossref abstract.
    implication_for_curriculum: Teacher materials should list expected misconceptions per lesson (natural-language and mathematics
      interference especially) and give a conceptual-change move, since teacher PCK is itself a named cause.
    confidence: high
  - id: chiodini-2021-progmiscon
    topic: misconceptions
    citation: Chiodini, L., Moreno Santos, I., Gallidabino, A., Tafliovich, A., Santos, A. L., & Hauswirth, M. (2021). A curated
      inventory of programming language misconceptions. Proceedings of ITiCSE '21, 380-386.
    source_url: https://www.chiodini.org/publications/iticse21-progmiscon.pdf
    retrieved_at: 2026-09-13
    study_type: position_paper
    sample: n/a (inventory of 198 misconceptions in Java, Python and JavaScript, collected over more than a decade of classroom
      observation; progmiscon.org)
    finding: Proposes an organizational structure for misconception collections (language-specific, tied to syntax/semantics,
      distinct from general orientation problems) and publishes 198 curated misconceptions. Useful as a taxonomy and naming
      scheme; it is not a prevalence study.
    effect_size: n/a
    evidence_level: weak
    caveats: Text-based languages and mostly university learners; no frequency data; not validated with children.
    implication_for_curriculum: Use as a checklist to name misconceptions consistently in teacher guides (e.g. assignment-as-equation),
      but do not treat it as evidence of what primary children actually believe.
    confidence: high
  - id: rich-2017-k8-trajectories
    topic: abstraction_by_age
    citation: 'Rich, K. M., Strickland, C., Binkowski, T. A., Moran, C., & Franklin, D. (2017). K-8 learning trajectories
      derived from research literature: Sequence, repetition, conditionals. Proceedings of ICER ''17, 182-190.'
    source_url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1145/3105726.3106166?fields=title,authors,year,venue,abstract,tldr
    retrieved_at: 2026-09-13
    study_type: systematic_review
    sample: n/a (in-depth review of over 100 scholarly articles on K-8 CS education)
    finding: Derives literature-based learning trajectories for Sequence, Repetition and Conditionals for K-8, ordering consensus
      learning goals from concrete (e.g. precise ordered instructions) to abstract (e.g. nested/conditional repetition). Notes
      that assumptions about context (mathematics, language) and the programming language directly shaped the trajectories.
    effect_size: n/a
    evidence_level: moderate
    caveats: Trajectories are synthesised from heterogeneous studies, not empirically validated with cohorts; only the abstract/TLDR
      was accessible in this session.
    implication_for_curriculum: 'Use these three trajectories as the spine for grades 2-6 sequencing: sequence before repetition
      before conditionals, with conditional-repetition combinations late (grades 5-6).'
    confidence: medium
  - id: rich-2018-decomposition-trajectory
    topic: abstraction_by_age
    citation: 'Rich, K. M., Binkowski, T. A., Strickland, C., & Franklin, D. (2018). Decomposition: A K-8 computational thinking
      learning trajectory. Proceedings of ICER ''18, 124-132.'
    source_url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1145/3230977.3230979?fields=title,authors,year,venue,abstract,tldr
    retrieved_at: 2026-09-13
    study_type: systematic_review
    sample: 'n/a (literature review: 63 learning goals synthesised into 13 consensus goals)'
    finding: Presents a K-8 learning trajectory for decomposition built from 63 literature-derived goals collapsed to 13 consensus
      goals, with justified pathways between them; decomposition is treated as a practice that develops from breaking familiar
      tasks into steps toward deliberately structuring programs.
    effect_size: n/a
    evidence_level: moderate
    caveats: Literature-derived, not cohort-validated; abstract-level read.
    implication_for_curriculum: Teach decomposition first on everyday/unplugged tasks (grades 2-3) and only later as program
      structure (procedures/custom blocks, grades 5-6).
    confidence: high
  - id: rich-2019-debugging-trajectory
    topic: abstraction_by_age
    citation: Rich, K. M., Strickland, C., Binkowski, T. A., & Franklin, D. (2019). A K-8 debugging learning trajectory derived
      from research literature. Proceedings of SIGCSE '19, 745-751.
    source_url: https://api.semanticscholar.org/graph/v1/paper/DOI:10.1145/3287324.3287396?fields=title,authors,year,venue,abstract,openAccessPdf
    retrieved_at: 2026-09-13
    study_type: systematic_review
    sample: n/a (rigorous analysis of K-8 CS education research)
    finding: 'Debugging has three dimensions students should learn: (1) strategies for finding and fixing errors, (2) types
      of errors, and (3) the role of errors in problem solving (errors as normal and informative). The trajectory guided an
      integrated mathematics+CT curriculum for grades 3-5.'
    effect_size: n/a
    evidence_level: moderate
    caveats: Literature-derived; abstract-level read.
    implication_for_curriculum: Assess debugging as three separable micro-skills from grade 3 (attitude to errors; classifying
      an error; applying a strategy), not as a single 'can fix bugs' outcome.
    confidence: high
  - id: seiter-foreman-2013-pect
    topic: abstraction_by_age
    citation: Seiter, L., & Foreman, B. (2013). Modeling the learning progressions of computational thinking of primary grade
      students. Proceedings of ICER '13, 59-66.
    source_url: https://www.computacional.com.br/files/Artigos/SEITER%20-%20Modeling%20the%20Learning%20Progressions%20of%20Computational%20Thinking%20of%20Primary%20Grade%20Students.pdf
    retrieved_at: 2026-09-13
    study_type: design_study
    sample: 150 Scratch projects from teacher-curated galleries, grades 1-6 (USA), 25 per grade
    finding: PECT model scores evidence variables (e.g. loops, conditionals, variables, parallelization, initialization) and
      design patterns. Conversate/Animate patterns appeared at all grades; patterns requiring conditionals and variables (Collision,
      Scoring) were under-represented in all grades except 5 and 6; proficiency involving initialization and program state
      (initialize-then-change) showed little evidence before grades 3-4; the Maintain Score pattern (variable creation and
      assignment) appears too advanced for most primary students.
    effect_size: n/a
    evidence_level: weak
    caveats: Small, non-random, artefact-only pilot (no interviews), projects selected by teachers; grade differences confounded
      with exposure; artefact analysis cannot distinguish understanding from copying.
    implication_for_curriculum: Do not require variables/score-keeping before grade 5; expect 'state and initialization' understanding
      to emerge around grades 3-4; grades 1-2 outcomes should be sequence, events and simple animation.
    confidence: high
  - id: kazakoff-2013-sequencing-robotics
    topic: abstraction_by_age
    citation: Kazakoff, E. R., Sullivan, A., & Bers, M. U. (2013). The effect of a classroom-based intensive robotics and
      programming workshop on sequencing ability in early childhood. Early Childhood Education Journal, 41(4), 245-255.
    source_url: https://api.ies.ed.gov/eric/?search=title:%22Intensive%20Robotics%20and%20Programming%20Workshop%20on%20Sequencing%20Ability%22&format=json&fields=title,author,publicationdateyear,source,description
    retrieved_at: 2026-09-13
    study_type: quasi_experimental
    sample: n=27 early-childhood (PreK-K) children at a STEM magnet school in Harlem, New York, plus a control group; 1-week
      CHERP tangible-programming workshop
    finding: Children in the 1-week robotics/programming workshop showed significant pre-to-post gains on a picture-story
