    source_url: https://api.crossref.org/works/10.1177/07356331241227793
    retrieved_at: 2026-09-13
    study_type: meta_analysis
    sample: 62 effect sizes from 18 articles (mixed ages)
    finding: Debugging interventions had a significant mean effect, g = 0.64 (95% CI [0.32, 0.96]), with true effects ranging
