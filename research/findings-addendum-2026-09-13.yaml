baseline_el_salvador:
  summary: 'There is no standalone Technology, Informática or Computación subject in grades 2–6. "Tecnología" appears only
    as one of five integrating axes (I, S, O, T, E) inside the subject "Ciencia y Tecnología" (CyT), and that axis is physics/engineering
    (measurement, structures, simple machines, circuits), not computing. Computing content first appears as a subject in 1.º
    de bachillerato ("Ciencias de la Computación", from 2025). Digital citizenship appears as a sub-block inside "Ciudadanía
    y Valores" in grades 3–6 (2026 programmes). The data strand of Matemática (2.º ciclo) carries data representation/analysis
    units.

    '
  subject_landscape_2a6:
  - claim: Since March 2022, grades 2–6 study "Ciencia y Tecnología", replacing "Ciencia, Salud y Medio Ambiente".
    source_id: mined_page_ciencia_educativa
    quote: introducen en marzo de 2022, los recursos educativos para la asignatura «Ciencia y Tecnología» destinados para
      2° a 6° grado, en reemplazo a la asignatura anterior de Ciencia, Salud y Medio Ambiente
    retrieved_at: 2026-09-13
    confidence: high
  - claim: The 2022 announcement dated the entry into force to week 8 (March) of the 2022 school year and named CyT as replacement
      for both "Ciencia, Salud y Medio Ambiente" and "Ciencias Naturales".
    source_id: mined_page_cyt_2022
    quote: los materiales de segundo a sexto grado entrarán en vigencia de manera oficial y en todos los centros educativos
      del país a partir de la Semana 8 (marzo) de la estrategia de continuidad educativa 2022
    retrieved_at: 2026-09-13
    confidence: high
  - claim: CyT is a 10-year continuous sequence from grade 2 to 2.º de bachillerato (ages 8–17).
    source_id: mined_cyt_2026_2a6
    quote: guía un proceso formativo de 10 años continuos que inicia en el segundo grado de educación básica y culmina en
      el segundo año de educación media
    retrieved_at: 2026-09-13
    confidence: high
