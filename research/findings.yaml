learning_science:
- id: unplugged_effects
  claim: The review includes 49 studies; its meta-analysis uses 12 studies and 16 effects, with g=1.028
    and very high heterogeneity (I²≈95.7%).
  source_url: https://link.springer.com/article/10.1186/s40594-023-00434-7
  retrieved_at: '2026-09-14T01:45:00Z'
  source_id: unplugged
  confidence: medium
  evidence_kind: documented
  evidence_level: Systematic review/meta-analysis; mixed interventions and designs
  outcome: CT measures
  limitations: Supports unplugged conceptual instruction, not equivalence in digital operations, long-term
    transfer, or an entire Salvadoran curriculum.
  source_locator: Meta-analysis results and limitations
- id: programming_transfer
  claim: 'The meta-analysis aggregates 105 studies and 539 effects: overall g=.49, near transfer .75 and
    far transfer .47. Active-control and unpublished studies yield smaller effects.'
  source_url: https://eric.ed.gov/?id=EJ1220317
  retrieved_at: '2026-09-14T01:45:00Z'
  source_id: transfer
  confidence: medium
  evidence_kind: documented
  evidence_level: Meta-analysis with heterogeneous designs
  limitations: Average effects do not establish reliable reading/maths gains for this curriculum. Selection,
    publication and control-group differences constrain causal generalization.
  curriculum_rule: Measure transfer separately using novel host-subject tasks and an active comparison;
    do not multiply teaching hours by an assumed transfer benefit.
- id: scratchmaths_trial
  claim: The 110-school trial found improved CT after one year but no KS2 mathematics effect after two
    years (effect size 0.00, 95% CI −.12 to .12).
  source_url: https://d2tic4wvo1iusb.cloudfront.net/production/documents/projects/ScratchMaths.pdf?v=1739945607
  retrieved_at: '2026-09-14T01:45:00Z'
  source_id: scratchmaths
  confidence: high
  evidence_kind: documented
  evidence_level: School-randomized efficacy trial
  locator: PDF pp. 5–6
  population: England, ages 9–11
  teacher_development: Two initial full days for each participating year-group teacher before implementation,
    with optional follow-up sessions; structured curriculum and classroom practice.
  equipment: At least one computer per two pupils
  implementation: 'High fidelity: 44% in Year 5 and 24% in Year 6; protected teacher preparation time
    mattered.'
  implication: Brief initial training can support a bounded programme; it does not establish reliable
    implementation or far transfer without sustained support.
- id: ceibal_training_length
  claim: The primary introductory CT course specifies 12 weeks at 10 hours per week (120 hours).
  source_url: https://edux.ceibal.edu.uy/courses/course-v1%3Aceibal%2BCEIBAL18_C1%2B1/about
  retrieved_at: '2026-09-14T01:45:00Z'
  source_id: ceibal_pd
  confidence: high
  evidence_kind: documented
  implication: Do not describe this primary course as a short induction. Remote-specialist co-teaching
    is also part of Ceibal implementation evidence.
- id: child_execution_misconceptions
  claim: A think-aloud study of 34 children in grades 2–4 (mean age 8.65) examines unplugged, Scratch
    and Python preconceptions, including loop-count and conditional interpretation errors.
  source_url: https://icer2025.acm.org/details/icer-2025-papers/24/Unplugged-Scratch-and-Python-Tracing-Primary-Students-Preconceptions-of-Programmi
  retrieved_at: '2026-09-14T01:45:00Z'
  source_id: misconceptions
  confidence: medium
  evidence_kind: documented
  evidence_level: Small qualitative study
  limitations: Documents possible reasoning errors, not population prevalence or a universal developmental
    order.
  design_response: Use trace tables, branch counterexamples and explain-the-next-step assessments rather
    than rewarding only a finished artefact.
- id: child_variable_misconceptions
  claim: Interviews with children aged 8–11 document confusion between a variable name and its value,
    retaining multiple assignments, copying direction and sequential state changes.
  source_url: https://theses.liacs.nl/pdf/2018-2019-KrabbendamTS.pdf
  retrieved_at: '2026-09-14T01:45:00Z'
  source_id: variables
  confidence: low
  evidence_kind: documented
  evidence_level: Bachelor thesis; small qualitative sample, not peer-reviewed population evidence
  locator: PDF pp. 12–14
  design_response: Ask learners to trace overwrite and copy with counters; treat the box analogy as a
    limited representation, not a complete model of all programming objects.
- id: age_7_proposal
  claim: For approximately age 7, propose concrete execution, short sequences, simple debugging and one-rule
    branches with visible state; this follows a curriculum precedent, not an age law.
  source_url: https://www.gov.uk/government/publications/national-curriculum-in-england-computing-programmes-of-study/national-curriculum-in-england-computing-programmes-of-study
  retrieved_at: '2026-09-14T01:45:00Z'
  source_id: eng_computing
  confidence: low
  evidence_kind: design_inference
  evaluation: Diagnostic task performance, language access and prior experience determine support; chronological
    age alone does not create a prerequisite edge.
- id: age_11_proposal
  claim: For approximately age 11, propose explicit state, variables, repetition/selection and comparison
    of representations with scaffolding; nested complexity depends on demonstrated readiness.
  source_url: https://www.gov.uk/government/publications/national-curriculum-in-england-computing-programmes-of-study/national-curriculum-in-england-computing-programmes-of-study
  retrieved_at: '2026-09-14T01:45:00Z'
  source_id: eng_computing
  confidence: low
  evidence_kind: design_inference
  evaluation: Pilot unfamiliar traces and explanations; distinguish standards-based aspiration from empirical
    readiness of every learner.
  source_refs:
  - child_variable_misconceptions
  - scratchmaths_trial
- id: generalist_pd_design
  claim: Pilot a bounded sequence with worked examples, misconception guides, rehearsal, preparation time
    and coaching. Do not promise that a single short course qualifies generalists to deliver the full
    hybrid scope.
  source_url: https://d2tic4wvo1iusb.cloudfront.net/production/documents/projects/ScratchMaths.pdf?v=1739945607
  retrieved_at: '2026-09-14T01:45:00Z'
  source_id: scratchmaths
  confidence: low
  evidence_kind: design_inference
  proposed_pilot: Initial two-day module plus supported teaching and review; duration is a proposal, not
    an established optimal dose.
  success_measures:
  - Teacher explanation and error diagnosis before/after
  - Independent lesson observation and delivery fidelity
  - Student conceptual and practical assessments separately
  - Preparation time and equity by classroom capability
  source_refs:
  - ceibal_delivery
  - ceibal_training_length
  - teacher_training_exists
- id: obsolescence_policy
  claim: Keep human agency, data quality, bias, uncertainty, privacy and system evaluation as stable learning
    objectives; version vendor-specific activities as replaceable representations.
  source_url: https://www.unesco.org/en/articles/ai-competency-framework-students
  retrieved_at: '2026-09-14T01:45:00Z'
  source_id: unesco_ai
  confidence: medium
  evidence_kind: design_inference
  ai_scope: AI literacy begins with accessible examples and critical judgment; do not require online accounts,
    prompt tricks or technical model training for all grades.
knowledge_structure_evidence:
- id: and_or_basis
  claim: Knowledge-space and surmise-system approaches motivate multiple alternative sufficient sets;
    a single binary prerequisite order is a restricted representation.
  source_url: https://escholarship.org/uc/item/94b9x5sw
  retrieved_at: '2026-09-14T01:45:00Z'
  source_id: knowledge_spaces
  confidence: medium
  evidence_kind: documented
  implication: Represent required sets and alternatives explicitly, while distinguishing empirical dependencies
    from expert hypotheses.
- id: q_matrix_role
  claim: A Q matrix relates assessment items to attributes; it is not by itself a sequencing graph.
  source_url: https://www.tandfonline.com/doi/full/10.1080/15434300902801917
  retrieved_at: '2026-09-14T01:45:00Z'
  source_id: qmatrix
  confidence: medium
  evidence_kind: documented
  implication: Keep it as an assessment projection; validation of attributes and item mappings remains
    necessary.
- id: probability_calibration
  claim: Educational Bayesian networks require defensible parameter sources and calibration; structure
    alone does not supply probabilities.
  source_url: https://arxiv.org/abs/1301.6722
  retrieved_at: '2026-09-14T01:45:00Z'
  source_id: bayes
  confidence: medium
  evidence_kind: documented
  implication: No invented prerequisite probabilities. Defer learner-state inference until suitable local
    response data and an approved calibration study exist.
- id: corequisite_not_prevalence
  claim: Design, programming and debugging are coupled practices in the programme; no evidence here quantifies
    that Technology has more corequisites than other subjects.
  source_url: https://www.gov.uk/government/publications/national-curriculum-in-england-computing-programmes-of-study/national-curriculum-in-england-computing-programmes-of-study
  retrieved_at: '2026-09-14T01:45:00Z'
  source_id: eng_computing
  confidence: medium
  evidence_kind: design_inference
  consequence: Permit co-learning bundles, but reject the unverified comparative prevalence claim as a
    graph-construction prior.
- id: cross_subject_semantics
  claim: The upper-secondary programme explicitly builds on prior mathematics and CyT. Proposed primary
    links to narrative sequence, coordinates and conditional language need task-specific review.
  source_url: https://www.mined.gob.sv/docs/Programa%20de%20estudios%20de%20Ciencias%20de%20la%20Computaci%C3%B3n%20%281er%20A%C3%B1o%29.pdf
