schema_version: phase1-research-1.0
metadata:
  phase: 1
  status: research_complete_with_explicit_gaps
  cutoff_date: '2026-09-13'
  cutoff_timezone: America/Bogota
  retrieval_session: 2026-09-14 UTC
  retrieved_at_semantics: Research-session observation timestamp, not original publication or event date
  baseline_version: sv-2026-09-13-v1
  production_code_written: false
  git_commit: null
  git_reason: Workspace is not a Git checkout; no commit or feat/context branch exists here
  scope: Evidence and proposed decisions only; no solved curriculum, empirical pilot, production schemas
    or domain tests claimed
  contract_override: Latest user Phase 1 request replaces earlier CLAUDE.md phase ordering and reserved
    decision filenames. Budget is nested in 0001; vocabulary in 0003. CLAUDE.md is not silently rewritten.
  request_sha256: 85116af02a78235f8e5440d96e322044102f7ae643e91da7f479b1d78d08a208
  contract_sha256: 21c50df790afb28c87bd8697ca7cbe871b961298c3fa0fa6d1b30fac9ed22a8c
  external_llm_calls: 0
  reproducibility_scope: Hash-pinned acquired sources and processed inventory; manually authored research
    and reviewable declarative checks. This phase is not the future deterministic LLM/solver pipeline.
methodology:
  claim_policy: Each substantive record carries source_url, retrieved_at, confidence and evidence_kind.
    Nested fields inherit that record provenance; additional sources are separate records or source_refs.
    Proposed mappings and constraints are explicitly inferences, not source quotations.
  confidence_policy:
    high: Direct official/primary statement or deterministic count from acquired source
    medium: Supported interpretation, secondary attribution, observational inference or contextual extrapolation
    low: Unverified, bounded absence, incomplete retrieval or untested design hypothesis
  license_policy: Only official publications or verified open licenses are admitted to the corpus. Rejected
    full-text sources remain bibliographic references for the requested contrast and critical appraisal;
    their full text is not stored in the corpus or admitted to a production pipeline. Official publication
    is not a claim of open copyright.
  search_method: Official MINED portals first; then current official international frameworks and primary
    study records. Independent reporting only for local policy announcements and device-audit contrast.
    Dates, populations, outcomes and publication status kept separate.
  limitations: Manual research snapshot. Not an exhaustive all-subject nationwide implementation audit.
    Live URLs can differ from indexed copies. No external messages sent. No experimental evidence collected
    in Salvadoran classrooms.
