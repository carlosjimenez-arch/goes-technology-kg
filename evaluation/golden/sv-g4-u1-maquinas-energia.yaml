schema_version: golden-record/1.0
case_id: sv-g4-u1-maquinas-energia
grade: 4
skill_map_entry: Identificar máquinas simples y complejas en dispositivos cotidianos, construir una máquina compleja y relacionar la energía que usa un dispositivo con su utilidad.
baseline_version: sv-2026-09-13-v1
annotation_method: llm_expert_cross_vendor
annotators: [Claude Fable 5.1]
status: provisional
adjudication: All ten indicators are Technology; 1.10 counts for appliances only.
micro_skills:
  - {id: g4-ejemplificar-simples, statement: "Señala máquinas simples en dispositivos del entorno y las nombra.", grade: 4, strand: technical_systems, cognitive_domain: knowing, min_tier: T0, evidence_keys: ["1.1"]}
  - {id: g4-clasificar-simples, statement: "Clasifica máquinas simples dadas según sus definiciones clásicas.", grade: 4, strand: technical_systems, cognitive_domain: applying, min_tier: T0, evidence_keys: ["1.2"]}
  - {id: g4-identificar-palancas, statement: "Identifica la clase de palanca en un dispositivo cotidiano señalando fulcro, fuerza y resistencia.", grade: 4, strand: technical_systems, cognitive_domain: applying, min_tier: T0, evidence_keys: ["1.3"]}
  - {id: g4-ejemplificar-complejas, statement: "Señala máquinas complejas del entorno y las distingue de las simples.", grade: 4, strand: technical_systems, cognitive_domain: knowing, min_tier: T0, evidence_keys: ["1.4"]}
  - {id: g4-descomponer-compleja, statement: "Identifica las máquinas simples que componen una máquina compleja dada.", grade: 4, strand: technical_systems, cognitive_domain: reasoning, min_tier: T0, evidence_keys: ["1.5"]}
