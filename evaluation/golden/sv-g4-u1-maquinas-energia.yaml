  - {id: g4-fuentes-energia, statement: "Identifica la fuente de energía de cada objeto de su inventario.", grade: 4, strand: technical_systems, cognitive_domain: knowing, min_tier: T0, evidence_keys: ["1.8"]}
  - {id: g4-energia-utilidad, statement: "Relaciona la forma de energía que usa un dispositivo con la utilidad que presta.", grade: 4, strand: technical_systems, cognitive_domain: reasoning, min_tier: T0, evidence_keys: ["1.9"]}
  - {id: g4-calcular-transformacion, statement: "Efectúa cálculos simples de energía en J para un electrodoméstico a partir de su potencia en W y el tiempo.", grade: 4, strand: technical_systems, cognitive_domain: applying, min_tier: T0, evidence_keys: ["1.10"]}
edges:
