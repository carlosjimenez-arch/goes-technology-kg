enforced_by:
  status: specified_not_implemented
  tests:
  - id: scope_weights_sum_to_one
    assertion: Each cycle weights sum to 1 and all grades 2..6 occur exactly once.
  - id: budget_all_modes
    assertion: For each mode, ledger sums equal allocations, capacities hold and each elapsed minute is
      charged once.
  - id: reject_unverified_official_budget
    assertion: A scenario labelled unverified cannot publish as official; absent period duration fails
      conversion.
  - id: vertical_coverage
    assertion: All required primary outcomes have explicit anchor and bridge mappings; coverage is not
      inferred from a strand weight.
score_semantics: 1–5 expert comparative judgments, not measured effect sizes. Weights reflect stated project
  priorities and remain contestable.
cycle_weights:
- grades:
  - 2
  - 3
  A: 0.4
  B: 0.2
  C: 0.4
- grades:
  - 4
  - 5
  - 6
  A: 0.25
  B: 0.2
  C: 0.55
weight_semantics: Share of approved instructional minutes for primary objectives, not indicator counts
  or effectiveness estimates. Assign one primary strand per ledger allocation; secondary tags do not double
  count time. Grades 2–3 and 4–6 match the relevant portions of first/second basic cycles.
role_tensions:
- from: technology_curriculum_designer
  position: Preserve material design, technical systems and social impact despite the upper-secondary
    CS anchor.
- from: computational_thinking_researcher
  position: Introduce CT early; do not claim generic mathematical transfer or age-determined mastery.
- from: ai_software_engineer
  position: Weights and budgets must be explicit inputs; reject infeasible allocations instead of silently
    dropping skills.
budget_policy:
  status: pending_verification
  official_default_hours: null
  requested_scenario_hours: 160
  requested_scenario_label: unverified_clock_hours_per_grade
  evidence_summary: CyT has 4/5 class periods weekly, not a separate technology entitlement. The T-axis
    proxy totals 20/25/25/0/20 periods by grade. Period duration is unverified.
  internal_unit: integer_minutes
  conversion_rule: Require verified period_minutes and weeks where converting official periods; preserve
    original units and citations. Do not treat class periods as 60-minute hours.
  modes:
    standalone: Each grade allocation <= approved own_minutes.
    transversal: Every minute charged to an identified host subject and unit/indicator, bounded by host
      capacity and total borrowing capacity; mandatory host coverage preserved.
    hybrid: Separate own and borrowed components, enforce both limits and disjoint minute accounting.
  recommended_deployment: Evaluate hybrid/transversal against actual host capacity; no authorized standalone
    allocation is assumed.
  required_inputs:
  - mode
  - grade
  - own_minutes
  - borrowed_minutes_cap
  - host_subject_capacities
  - period_minutes_when_converting
  - calendar_version
  - source_evidence
  - policy_approval
  shared_activity_rule: Count elapsed classroom time once; record multiple learning contributions separately.
    A contribution is not extra time.
  infeasible_behavior: Return uncovered mandatory targets, saturated hosts and blocking constraints; never
    auto-expand the budget or weaken T0/coverage.
  sensitivity_plan: Compare user-specified scenarios in all three modes; report coverage, preparation
    burden and practical residuals. No solver run is claimed in Phase 1.
