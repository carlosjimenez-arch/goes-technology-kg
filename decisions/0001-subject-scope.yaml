context: 'Phase 1 direction accepted by maintainer: A todo Ok. Empirical uncertainties and deferred implementation
  checks remain explicit.'
options:
- id: A
  name: Design and technology
  scores:
    vertical_alignment: 2
    generalist_feasibility: 4
    t0_feasibility: 4
    transfer: 3
    obsolescence: 5
  pros:
  - Strong existing CyT connection; tangible design and systems.
  cons:
  - Insufficient computing/data emphasis for the vertical anchor; some circuits exceed paper-only resources.
  weighted_score: 3.45
- id: B
  name: Digital competence
  scores:
    vertical_alignment: 3
    generalist_feasibility: 3
    t0_feasibility: 1
    transfer: 3
    obsolescence: 2
  pros:
  - Information literacy, safety and purposeful digital production.
  cons:
  - Operational outcomes require devices; tool emphasis risks obsolescence and weak computational depth.
  weighted_score: 2.45
- id: C
  name: Computer science and CT
  scores:
    vertical_alignment: 5
    generalist_feasibility: 2
    t0_feasibility: 4
    transfer: 3
    obsolescence: 5
  pros:
  - Direct vertical alignment; durable conceptual nucleus with unplugged options.
  cons:
  - Generalist pedagogy demanding; can marginalize material design and citizenship. Practical programming
    still needs devices.
  weighted_score: 3.85
- id: D
  name: Explicit hybrid with an early CT strand
  scores:
    vertical_alignment: 5
    generalist_feasibility: 3
    t0_feasibility: 4
    transfer: 4
    obsolescence: 5
  pros:
  - Retains technical design, deliberate CS progression and a protected citizenship strand.
  cons:
  - Broader scope and integration burden; allocation weights need feasibility and learning pilots.
  weighted_score: 4.2
criteria:
- id: vertical_alignment
  weight: 0.3
  interpretation: Explicit bridge to Salvadoran first-year Computer Science, without importing its whole
    syllabus into primary.
- id: generalist_feasibility
  weight: 0.25
  interpretation: Deliverable by primary teachers with bounded preparation and sustained support.
- id: t0_feasibility
  weight: 0.2
  interpretation: Conceptual teaching and assessment under T0; practical residuals visible.
- id: transfer
  weight: 0.1
  interpretation: Opportunities for directly taught cross-subject application; not assumed far-transfer
    effects.
- id: obsolescence
  weight: 0.15
  interpretation: Stable concepts, practices and judgment rather than vendor operations.
selected_option: D
rationale:
- 'Accept the direction of the proposed A-to-C shift, but reject delaying CT until upper primary: early
  precise execution and debugging have curricular precedent.'
- Keep B at an explicit floor for safety, source evaluation, data responsibility and AI judgment; do not
  make it a productivity-software course.
- The exact 40/20/40 and 25/20/55 mixes are pilot hypotheses, not values derived from a meta-analysis.
- Existing CyT already carries design/material systems. Reuse compatible objectives and avoid adding a
  duplicate subject load.
- 'Generalist feasibility is the binding risk: begin with a bounded supported sequence and observable
  assessment, then revise weights from workload and learning evidence.'
consequences:
- Do not implement or publish weighted curriculum until this proposal is accepted.
- Require an explicit grade 7–9 bridge, not a promise that grade 6 alone guarantees bachillerato readiness.
- New evidence or changed official programmes triggers a new baseline version and impact analysis.
