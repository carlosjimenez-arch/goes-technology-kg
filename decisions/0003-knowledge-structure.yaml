  - target
  preserved_statuses:
  - candidate
  - reviewed
  - published
  - rejected
  extensions_proposed:
  - dependency_rule
  - prerequisite_clause
  - co_learning_group
  - external_skill_ref
  serialization: Versioned Technology contract; nodes.jsonl/edges.jsonl, JSON manifests and typed rule/group
    artifacts. Preserve sibling interchange names; do not squeeze OR groups into a binary prerequisite
    edge enum.
  migration_rule: Project single-member strict clauses to prerequisite_of when semantics match. Multi-member
    alternatives remain explicit; reject lossy export as an equivalent graph.
  schema_status: Design only. Canonical Pydantic contracts in schemas/ await implementation-phase approval.
worked_examples:
- id: and_or
  target: debug_branch
  any_of:
  - all_of:
    - trace_sequence
    - evaluate_condition
  - all_of:
    - demonstrate_equivalent_branch_reasoning
  semantics: Either both first-clause skills or the explicit alternative; grade ordering alone does not
    satisfy a clause.
  evidence_status: Synthetic semantic fixture, not an empirically established prerequisite.
- id: co_learning
  members:
  - design_program
  - debug_program
  relation: co_learning_group
  semantics: Iterate together; each learner still supplies evidence of both outcomes.
  evidence_status: Pedagogical hypothesis consistent with coupled practices, not quantified necessity.
grade_move_case:
  request: Move coordinate-based control from grade 4 to grade 3
  external_requirements:
  - Exact mathematics coordinate/position skill reference with grade and baseline
  - Language instruction/comprehension supports
  dependency_fixture:
    target: coordinate_control
    any_of:
    - all_of:
      - trace_sequence
      - coordinate_representation
    original_grade: 4
    requested_grade: 3
    known_grades:
      trace_sequence: 2
      coordinate_representation: 4
  strict_result: 'Blocked: required coordinate representation is scheduled later.'
  alternatives:
  - Fund and assess a grade-3 mathematics bridge with host approval, then recompute capacity.
  - Use a relative-movement variant only if its changed outcome and preserved constructs are explicit;
    do not certify coordinate_control from it.
  - Keep the outcome in grade 4.
  report_fields:
  - failed_clause
  - external_skill_and_version
  - affected_descendants
  - bundle_changes
  - minutes_by_host_before_after
  - tier_variant_changes
  - uncovered_anchors
  - feasible_alternatives
  caveat: The grades in this fixture are synthetic and are not asserted as the actual Salvadoran mathematics
    progression.
deterministic_contract:
  canonicalization: Stable ID sorting, canonical JSON, UTF-8, LF and deterministic numeric formatting.
    No run-time timestamps in reproducible content.
  rules: Stable clause ordering and IDs; deterministic tie-breaking among feasible alternatives.
  solver: Pin version, configuration, seed and determinism controls; a seed alone is insufficient. Compare
    complete serialized outputs byte for byte.
  llm: No unrecorded model generation in graph compilation. Hash prompt_version and canonical input; version
    replay payloads and model/config provenance.
  performance: Use scipy.sparse for appropriate adjacency projections, numpy/polars for transformations;
    benchmark representative rule and move workloads with a >20% regression failure gate in the implementation
    phase.
role_tensions:
- from: knowledge_graph_researcher
  position: Acyclicity belongs to strict precedence, not every semantic relation. Higher expressive power
    requires clear logical semantics.
- from: technology_curriculum_designer
  position: Show teachers concrete blocked outcomes and co-learning groups; graph terminology must not
    replace pedagogical justification.
- from: ai_software_engineer
  position: Keep simple serializable rules and sparse projections; avoid probabilistic infrastructure
    without data or a justified runtime need.
