options:
- id: dag
  name: Binary prerequisite DAG
  scores:
    corequisites_and_and_or: 2
    time_constrained_sequencing: 4
    teacher_auditability: 4
    maintenance_cost: 5
    grade_move_analysis: 3
  pros:
  - Simple reachability and topological order; sparse representation.
  cons:
  - Multiple incoming edges usually mean AND; OR needs gates. Mutual prerequisite edges create cycles
    and falsely describe co-learning.
- id: hypergraph
  name: Typed AND/OR dependency rules plus co-learning groups
  scores:
    corequisites_and_and_or: 5
    time_constrained_sequencing: 4
    teacher_auditability: 4
    maintenance_cost: 3
    grade_move_analysis: 5
  pros:
  - Alternative sufficient sets and joint learning explicit; explain which clause blocks a move.
  cons:
  - More validation and solver modeling; topological sorting alone cannot select alternatives or allocate
    time.
- id: probabilistic
  name: Probabilistic prerequisite network
  scores:
    corequisites_and_and_or: 3
    time_constrained_sequencing: 3
    teacher_auditability: 2
    maintenance_cost: 1
    grade_move_analysis: 4
  pros:
  - Can model uncertainty and learner evidence when calibrated.
  cons:
  - No local calibration data; invented probabilities would hide judgments. Does not replace the curriculum
    time ledger.
- id: qmatrix
  name: Q matrix only
  scores:
    corequisites_and_and_or: 1
    time_constrained_sequencing: 1
    teacher_auditability: 3
    maintenance_cost: 3
    grade_move_analysis: 2
  pros:
  - Clear assessment-item/attribute map.
  cons:
  - Does not encode instructional sequencing, alternatives or co-learning scheduling.
- id: ontology
  name: Pure hierarchical ontology
  scores:
    corequisites_and_and_or: 1
    time_constrained_sequencing: 1
    teacher_auditability: 5
    maintenance_cost: 4
    grade_move_analysis: 1
  pros:
  - Readable taxonomy and shared terminology.
  cons:
  - Containment is not necessary learning order or a resource/budget constraint.
criteria:
- corequisites_and_and_or
- time_constrained_sequencing
- teacher_auditability
- maintenance_cost
- grade_move_analysis
selected_option: hypergraph
rationale:
- Choose a rule layer only because the project requires alternative prerequisites and co-learning; do
  not assume a graph is always the answer.
- Keep a hierarchy for classification and a Q projection for assessment, not as substitutes for dependency
  semantics.
- Use AND within a clause and OR between clauses; reify clauses in ordinary JSON/JSONL if needed. No graph
  database or specific solver vendor is selected.
- Collapse explicit co-learning groups for strict precedence checks; do not automatically condense arbitrary
  prerequisite cycles, which may be errors.
- Soft recommendations, documentary order and cross-subject support remain distinct from necessary prerequisites.
consequences:
- Rule semantics and external references need stricter validation than a pure DAG.
- No production solver, complexity guarantee or empirical prerequisite network is delivered in research.
- Teacher review must distinguish inferred prerequisites from documented statements before publication.
