enforced_by:
  status: specified_not_implemented
  tests:
  - id: and_or_truth_table
    assertion: Exhaust all subsets of three fixture prerequisites; satisfy (a AND b) OR c exactly.
  - id: corequisite_vs_cycle
    assertion: Approved co-learning group is schedulable; undeclared circular hard prerequisites are rejected.
  - id: move_g4_to_g3
    assertion: Moving the target earlier while a required external skill remains in grade 4 reports infeasible;
      approved funded bridge removes only that blocker.
  - id: property_graph_invariants
    assertion: Hypothesis covers ID uniqueness, endpoints, acyclic strict projection, clause satisfaction,
      permutation invariance and no silent loss in export.
  - id: q_is_not_prerequisite
    assertion: An item assessing two attributes creates assessment mappings, not an invented prerequisite
      edge.
score_semantics: 1–5 engineering judgments; higher is better, including lower maintenance burden. No measured
  runtime benchmark is implied.
semantics:
  dependency_rule: A target can be scheduled only if at least one prerequisite clause is satisfied. Each
    clause requires every member outcome to have reached its specified evidence state.
  empty_rule: Explicitly declared no hard prerequisite; absent extraction is not equivalent to empty prerequisites.
  corequisite: Approved co-learning bundle with shared teaching window and individual outcome assessments;
    not reciprocal hard prerequisite edges.
  ordering: Strict dependencies between bundles form an acyclic projection. Internal pedagogical iteration
    is allowed; a genuine circular hard dependency must fail review.
  time: Bundle teaching minutes are explicitly modeled, never assumed to equal sum or max of member durations.
    Alternatives and variant resources are part of feasibility.
  external_dependencies: Reference immutable external skill IDs, subject, schema and baseline versions
    plus evidence. Do not depend on a subject node such as Mathematics as if it were a skill.
  grade_vs_mastery: An external skill assigned to an earlier grade is a scheduling assumption, not evidence
    every student mastered it. Diagnose and fund bridging.
