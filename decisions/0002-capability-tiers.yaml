    matched_expected: true
  - id: paper_python_is_not_execution
    observed_strict_coverage: false
    matched_expected: true
  - id: paper_circuit_is_not_measurement
    observed_strict_coverage: false
    matched_expected: true
  - id: omitted_citizenship
