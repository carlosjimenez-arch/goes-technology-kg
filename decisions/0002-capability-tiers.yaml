schema_version: phase1-decision-1.0
id: '0002'
title: Capability tiers, T0 coverage and practical competence limits
status: accepted
date: '2026-09-13'
supersedes: []
roles:
- technology_curriculum_designer
- computational_thinking_researcher
- knowledge_graph_researcher
- ai_software_engineer
approval_required_before_implementation: false
affected_invariants:
- T0_access
- honest_mastery_claims
- material_feasibility
- coverage
- teacher_feasibility
context: 'Phase 1 direction accepted by maintainer: A todo Ok. Empirical uncertainties and deferred implementation
  checks remain explicit.'
options:
- id: strict_full_equivalence
  name: All anchor performances certified in T0
  pros:
  - Literal strongest coverage guarantee.
  cons:
  - Infeasible for operating software, configuring Python or measuring with a multimeter; would create
    false certification.
- id: conceptual_t0_with_practical_bridge
  name: Complete T0 primary conceptual route, explicit later practical bridge
  pros:
  - Robust conceptual access and honest residuals; compatible with staged vertical mapping.
  cons:
  - Requires explicit maintainer acceptance of the coverage definition and funded practical access before
    full digital readiness.
- id: minimum_t1
  name: Require shared devices for all learners
  pros:
  - Can observe individual digital operations with rotations.
  cons:
  - Violates the requested no-device robustness; power, access and time are not guaranteed.
criteria:
- Teach and assess conceptual objectives without devices
- Never substitute a conceptual proxy for observed digital execution
- Make resource and time constraints visible
- Preserve individual evidence under shared access
- Prevent unnoticed mandatory-coverage loss
selected_option: conceptual_t0_with_practical_bridge
rationale:
- Unplugged evidence supports conceptual CT; it does not establish full operational equivalence.
- The official anchor distinguishes reasoning from actual use of computing environments; the primary CyT
  programme also requires real instruments.
- Coverage by topic label is too weak. Assess the observable construct and keep practical residuals explicit.
consequences:
- Full T0-equivalence is disproved by a necessary-resource counterexample; no production test suite or
  population equivalence result exists yet.
- T1 practical rotations require individual access time in the solver, not merely presence of a teacher
  laptop.
- Reassess classroom capabilities per deployment; distribution counts cannot assign a tier.
