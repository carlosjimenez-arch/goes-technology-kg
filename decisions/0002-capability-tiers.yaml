role_tensions:
- from: computational_thinking_researcher
  position: A paper trace can be valid evidence of execution reasoning, not evidence of using an editor.
- from: technology_curriculum_designer
  position: Real construction and measurement can be essential to technological education; material limits
    must not erase them silently.
- from: ai_software_engineer
  position: Fail the strict claim using counterexamples. Encode the proposed narrower guarantee only after
    approval.
