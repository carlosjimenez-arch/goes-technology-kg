enforced_by:
  status: specified_not_implemented
  tests:
  - id: t0_required_outcome_coverage
    assertion: For every required outcome, require a feasible assessed variant at T0; proxy-only evidence
      cannot satisfy an operational outcome.
  - id: reject_missing_variants
    assertion: Missing variant, assessment, bridge or capability yields a diagnostic, not skipped coverage.
  - id: tier_resource_counterexample
    assertion: T3 without a multimeter fails a multimeter task; T1 teacher-only demo fails individual-operation
      evidence.
  - id: t0_budget_feasibility
    assertion: Substitute T0 durations before solving; a slower fallback cannot inherit the digital activity
      duration.
approval_blocker: This selection is a proposed clarification of acceptable degradation, not an accepted
  weakening of the hard rule. The strict full-anchor-equivalence gate remains failed. No complete curriculum
  has yet been built or tested.
tiers:
- id: T0
  rank: 0
  name: unplugged
  conditions: No digital device, power or Internet assumed; paper, body, ordinary objects and board.
- id: T1
  rank: 1
  name: shared
  conditions: At least one usable shared device; offline baseline. Teacher-only display and group hands-on
    access are distinct access profiles.
- id: T2
  rank: 2
  name: one_to_one_offline
  conditions: A usable device per learner with required applications/content installed; no reliable Internet
    assumed.
- id: T3
  rank: 3
  name: one_to_one_online
  conditions: T2 plus adequate usable connectivity for the specified task; privacy and account constraints
    still checked.
tier_limits: 'Ordinal digital access is not a complete material model: electricity, accessible input/output,
  language, offline software, projection, consumables, safe electrical kits and teacher competence are
  independent capabilities. T3 does not imply a multimeter. Teacher-only demonstration is not individual
  hands-on performance.'
micro_skill_contract:
  required_fields:
  - id
  - observable_outcome
  - success_criteria
  - anchor_ids
  - min_tier
  - required_capabilities
  - evidence_modality
  - estimated_minutes
  - downgrade_variant
  min_tier_semantics: Lowest tier allowing the stated outcome AND assessment, not merely a discussion
    of the topic.
  downgrade_variant: Null only when min_tier=T0 or no honest substitute exists; otherwise a referenced
    variant for each lower feasible tier, with reason for unsupported tiers.
  variant_fields:
  - id
  - target_tier
  - preserved_constructs
  - assessment
  - rubric
  - estimated_minutes
  - required_capabilities
  - lost_performances
  - equivalence_status
  - practical_bridge
  - evidence_ids
  equivalence_status_values:
  - same_construct_candidate
  - validated_same_construct
  - conceptual_proxy_only
  - no_valid_variant
  identity_rule: A variant is a representation/activity linked to the same concept where valid; changed
    observable outcomes must not retain an equivalence claim. Preserve sibling micro_skill and representation
    entities.
acceptable_degradation_proposal:
  definition: All approved primary conceptual outcomes remain teachable and individually assessable in
    T0, with no missing conceptual anchor mapping and no reduced success criterion. Digital/physical operational
    outcomes are explicitly separate and require a scheduled practical bridge.
  structural_gate:
  - Every required conceptual outcome maps to at least one feasible T0 variant and an assessment.
  - Each variant preserves the construct and rubric; no hidden device, power, network, literacy or materials
    dependency.
  - Every required anchor strand has conceptual coverage; coverage does not certify terminal practical
    performance.
  - T0 variant duration and material/teacher requirements fit the approved budget.
  - Every lost operation has a named bridge outcome, responsible stage and required capability; no unresolved
    residual may be published as full readiness.
  empirical_gate:
    status: not_run
    proposed_design: Pilot equivalent-form conceptual assessments with T0 and device-supported teaching,
      account for initial ability, classroom clustering and access needs.
    proposed_noninferiority_margin_percentage_points: 10
    margin_status: Policy hypothesis requiring educational justification and approval, not an evidence-derived
      universal threshold.
    pass_rule: Lower confidence bound of T0 minus comparison performance is above the approved negative
      margin for every mandatory conceptual strand; assess practical outcomes separately.
    stop_rule: Missing data or an underpowered study is inconclusive, not a pass.
  strict_original_gate: If complete coverage means every actual upper-secondary digital/physical performance
    in T0, the decision is infeasible and must report failure.
